    <!-- Error overlay (preserved from original) -->
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;width:100%;font-size:16px;">ERROR: ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;width:100%;font-size:16px;">PROMISE ERROR: ' + e.reason + '</div>';
      });
      
      const originalConsoleError = console.error;
      console.error = function(...args) {
        document.body.innerHTML += '<div style="position:fixed;bottom:0;left:0;z-index:9999;background:orange;color:black;padding:20px;width:100%;font-size:16px;max-height:50vh;overflow:auto;">CONSOLE ERROR: ' + args.join(' ') + '</div>';
        originalConsoleError.apply(console, args);
      };
    </script>
